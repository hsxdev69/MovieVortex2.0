name: Build MovieVortex APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build MovieVortex APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build MovieVortex APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: locate_apk
        run: |
          echo "Finding generated APKs..."
          find app/build/outputs/apk/ -name "*.apk" -ls
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload MovieVortex APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieVortex-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
