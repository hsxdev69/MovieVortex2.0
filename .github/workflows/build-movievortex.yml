name: Build MovieVortex APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build MovieVortex APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build MovieVortex APK
        run: |
          ./gradlew assembleStableDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: locate_apk
        run: |
          echo "Finding generated APKs..."
          find app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload MovieVortex APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieVortex-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
